services:
  medusa:
    build: .
    restart: unless-stopped
    environment:
      # sslmode=disable is required: without it, Medusa's database-config loader treats any
      # non-localhost host as "remote" and forces an SSL connection attempt by default
      # (see @medusajs/utils load-module-database-config.js), which hangs indefinitely
      # against a Postgres server that has SSL turned off instead of cleanly failing/falling back.
      DATABASE_URL: postgres://${MEDUSA_DB_USER:-life_webapp_shop_admin}:${MEDUSA_DB_PASSWORD:-change-me}@${MEDUSA_DB_HOST:-db}:5432/${MEDUSA_DB_NAME:-life_webapp_shop_admin}?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me}
      COOKIE_SECRET: ${COOKIE_SECRET:-change-me}
      STORE_CORS: ${STORE_CORS:-https://shop.heimfeld.life}
      ADMIN_CORS: ${ADMIN_CORS:-https://shop-admin.heimfeld.life}
      AUTH_CORS: ${AUTH_CORS:-https://shop-admin.heimfeld.life}
      # Public URL this backend is reachable at - used for the Admin Dashboard's own API
      # calls AND, critically, to build the public URL of uploaded files (product images).
      # Without it, uploaded file URLs default to "http://localhost:9000/static/...",
      # which never resolves for an actual browser (see medusa-config.ts).
      MEDUSA_BACKEND_URL: ${MEDUSA_BACKEND_URL:-https://shop-admin.heimfeld.life}
      # Secret key (sk_...) - from the Stripe Dashboard, Developers > API keys. Required for
      # the Stripe payment provider (medusa-config.ts) - without it Medusa fails to start.
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      # From the Stripe Dashboard webhook endpoint you create for
      # https://<this-domain>/hooks/payment/stripe_stripe (signing secret, whsec_...) - see
      # README for which events to select. Without it, Stripe webhook events are rejected and
      # orders never get marked paid after checkout.
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    ports:
      - "${MEDUSA_PORT:-9000}:9000"
    networks:
      - proxy
      - db-net
      - internal
    depends_on:
      - redis

  # Only this app's own event bus/workflow/cache - not shared with goa_webapp, which
  # doesn't use Redis at all. Kept off the proxy/db networks entirely - nothing outside
  # this compose project needs to reach it.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - internal

networks:
  # Caddy's own network - lets Caddy reach this container by its service name ("medusa").
  # Find the real name the same way as in goa_webapp_shop's docker-compose.yml.
  proxy:
    external: true
    name: ${PROXY_NETWORK_NAME:-fotosvorju-proxy}
  # The network goa_webapp's own containers (app + Postgres) sit on - lets this app reach
  # the shared Postgres container by name (MEDUSA_DB_HOST, e.g. "life_webapp-db-1").
  db-net:
    external: true
    name: ${DB_NETWORK_NAME:-life_webapp_default}
  # Plain internal network for medusa <-> redis - Compose creates this one itself.
  internal: {}
